<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Clutch Scraper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Clutch Scraper</h1>
    <form id="scrape-form">
      <label>
        Base URL
        <input type="text" id="baseUrl" value="https://clutch.co/agencies/digital-marketing" required>
      </label>
      <label>
        Number of Pages
        <input type="number" id="totalPages" min="1" value="3" required>
      </label>
      <label class="toggle">
        <span>Run Headless</span>
        <input type="checkbox" id="headless" checked>
        <div class="slider"></div>
      </label>
      <button type="submit">Start Scraping</button>
    </form>

    <div id="status" class="card hidden">
      <p id="status-text">Idle</p>
      <p id="records"></p>
      <a id="download-link" href="#" download="clutch_companies.csv" class="button hidden">Download CSV</a>
      <button id="new-scrape" class="button secondary hidden">New Scrape</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
